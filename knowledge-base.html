<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base</title>

  <!-- GitHub Dark Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-dark.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      /* Dark gradient background */
      background: radial-gradient(circle at 50% 20%, #1a1f2c, #0d1117 80%);
      color: #c9d1d9;
      position: relative;
    }

    /* Centered GitHub Container */
    .markdown-body {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      padding: 50px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div id="knowledge-base" class="markdown-body"></div>

  <!-- Marked.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    const markdownIndex = `
# My Knowledge Base

Welcome to my personal database of notes and engineering practices.


*Last updated: 2026*`;

    document.getElementById('knowledge-base').innerHTML = marked.parse(markdownIndex);
  </script>

</body>
</html>
