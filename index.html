<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Markdown Template</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css" id="theme-dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css" id="theme-light" disabled>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* Theme variables */
    :root {
      --bg-color: #0d1117;
      --btn-bg: #21262d;
      --btn-text: #c9d1d9;
      --btn-border: #30363d;
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --btn-bg: #f6f8fa;
      --btn-text: #24292f;
      --btn-border: rgba(27, 31, 36, 0.15);
    }

    body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
      background-color: var(--bg-color);
      transition: background-color 0.2s ease;
    }

    /* Fixed Theme Toggle Button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--btn-text);
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      filter: brightness(1.1);
    }

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="toggle-btn" onclick="toggleTheme()">☀️ Light Mode</button>

  <article id="content" class="markdown-body"></article>

  <script>
    // Function to render raw Markdown text
    function renderMarkdown(markdownText) {
      document.getElementById('content').innerHTML = marked.parse(markdownText);
    }

    // Toggle theme state
    function toggleTheme() {
      const htmlEl = document.documentElement;
      const currentTheme = htmlEl.getAttribute('data-theme');
      const darkStylesheet = document.getElementById('theme-dark');
      const lightStylesheet = document.getElementById('theme-light');
      const toggleBtn = document.getElementById('toggle-btn');

      if (currentTheme === 'dark') {
        htmlEl.setAttribute('data-theme', 'light');
        darkStylesheet.disabled = true;
        lightStylesheet.disabled = false;
        toggleBtn.innerText = '🌙 Dark Mode';
      } else {
        htmlEl.setAttribute('data-theme', 'dark');
        darkStylesheet.disabled = false;
        lightStylesheet.disabled = true;
        toggleBtn.innerText = '☀️ Light Mode';
      }
    }

    // Sample Content
    const sampleMarkdown = `
# Page Title

Welcome to your Markdown template.

## Features
* Light and Dark theme toggle
* Standard GitHub CSS styling
* Code snippet support

\`\`\`javascript
const greet = (name) => \`Hello, \${name}!\`;
console.log(greet("World"));
\`\`\`
`;

    // Initialize content
    renderMarkdown(sampleMarkdown);
  </script>

</body>
</html>
